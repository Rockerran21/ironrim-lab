<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IronRim</title>
<meta name="description" content="Ten design directions for the IronRim website redesign. Cycle with the Next button.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b1120;overflow:hidden}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0}
  #hud{position:fixed;bottom:18px;right:18px;z-index:99;display:flex;gap:8px;align-items:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .hud-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.25);
       background:rgba(10,14,25,.78);backdrop-filter:blur(10px);color:#e6ecf7;border-radius:99px;
       padding:10px 18px;font-size:.85rem;font-weight:600;cursor:pointer;user-select:none;
       transition:background .15s,transform .15s;text-decoration:none}
  .hud-btn:hover{background:rgba(30,40,65,.9);transform:translateY(-1px)}
  .hud-btn:active{transform:translateY(0)}
  #badge{font-variant-numeric:tabular-nums;opacity:.85;font-weight:500}
  #prev{padding:10px 14px}
  #gallery{padding:10px 14px}
  @media(max-width:520px){#hud{bottom:12px;right:12px}.hud-btn{padding:9px 14px;font-size:.8rem}}
</style>
</head>
<body>
<iframe id="frame" title="IronRim" allow="fullscreen"></iframe>
<div id="hud">
  <a class="hud-btn" id="gallery" href="designs/" title="All designs">⊞</a>
  <button class="hud-btn" id="prev" title="Previous design (←)">←</button>
  <button class="hud-btn" id="next" title="Next design (→)">
    <span id="badge">Design 1/5</span>&nbsp;Next →
  </button>
</div>
<script>
(function(){
  var DESIGNS=[
    ["21-slate","Slate Blue & Cool Gray"],
    ["18-corporate","Corporate Black"],
    ["19-navy","Navy & Ice Blue"],
    ["22-black-beige","Black & Beige"],
    ["25-multipage","Multi-page (Slate)"]
  ];
  var KEY="ironrim_design_idx";
  var frame=document.getElementById("frame"),badge=document.getElementById("badge");
  var i=0;
  try{
    var h=location.hash.match(/^#d(\d+)$/);
    if(h){i=(parseInt(h[1],10)-1+DESIGNS.length)%DESIGNS.length;}
    else{var s=localStorage.getItem(KEY);if(s!==null)i=(parseInt(s,10)||0)%DESIGNS.length;}
  }catch(e){}
  function show(n){
    i=((n%DESIGNS.length)+DESIGNS.length)%DESIGNS.length;
    frame.src="designs/"+DESIGNS[i][0]+"/";
    badge.textContent="Design "+(i+1)+"/"+DESIGNS.length;
    document.title="IronRim - "+DESIGNS[i][1];
    try{localStorage.setItem(KEY,String(i));history.replaceState(null,"","#d"+(i+1));}catch(e){}
  }
  document.getElementById("next").addEventListener("click",function(){show(i+1)});
  document.getElementById("prev").addEventListener("click",function(){show(i-1)});
  window.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight")show(i+1);
    else if(e.key==="ArrowLeft")show(i-1);
  });
  show(i);
})();
</script>
</body>
</html>
